version: "3.8"

services:
  mongo:
    container_name: mongodb
    image: mongo
    ports:
      - "27017:27017"
    

  backend:
    container-name: backend
    build: ./backend
    env_file:
      - ./backend/.env.sample
    ports:
      - "5000:5000"


  frontend:
    container_name: frontend
    build: ./frontend
    env_file:
      - ./frontend/.env.sample
    ports:
      - "5173:5173"