# =========================================
# MongoDB Deployment + Service
# =========================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongo-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo-container
          image: mongo:6.0
          ports:
            - containerPort: 27017

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

            - name: mongo-seed
              mountPath: /data

          command:
            - /bin/bash
            - -c
            - |
              mongod --bind_ip_all &
              sleep 10
              mongoimport --db wanderlust --collection posts --file /data/sample_posts.json --jsonArray
              wait

      volumes:
        - name: mongo-storage
          emptyDir: {}

        - name: mongo-seed
          hostPath:
            path: /data
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service

metadata:
  name: mongo-service

spec:
  selector:
    app: mongo

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

  type: ClusterIP

# =========================================
# Backend Deployment + Service
# =========================================
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-container
          image: yashwantlohar/wan-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: MONGO_URL
              value: mongodb://mongo-service:27017/wanderlust

          # Backend waits for MongoDB
          command:
            - /bin/sh
            - -c
            - |
              npm start

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: LoadBalancer
  
# =========================================
# Frontend Deployment + Service
# =========================================
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend-container
          image: yashwantlohar/wan-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5173

          env:
            - name: VITE_API_PATH
              value: http://backend-service:5000

          command:
            - npm
            - run
            - dev

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
